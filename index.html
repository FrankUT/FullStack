<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi primer HTML</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
    <div class="display_flex">
        <div class="cajas_1 flex_container">ELEMENTO1</div>
        <div class="cajas_2 display_inline_block">ELEMENTO2</div>
        <div class="cajas_3 display_inline_block">ELEMENTO3</div>
        <div class="cajas_4 display_inline_block">ELEMENTO4</div> 
    </div>

      <!--- Sección de bienbenida-->
      <section>
        <div class="estilo_tituloP">
          <h1 class="estilo_parrafosP">Bienvenido a mi primer proyecto web</h1>
        </div>

        <p class="estilo_parrafosP">
          Este es mi primer proyecto web donde podras encontrar imágenes y
          videos que puedas disfrutar un rato >:D
        </p>
        <input type="text" placeholder="Escribe tu nombre" />
        <div class="p">
          <p>Autor: Franklin Alexander Cante Bayona</p>
        </div>
      </section>

      <!--- Selección de imágenes-->
      <section>
        <h3>Imágenes divertidas juaaaaaajajajajaj</h3>
        <figure>
          <img
            src=".\imagenes\imagen_1.jpg"
            alt="Perro loco"
            width="300"
            height="200"
          />
          <figcaption>Imágen de un perro bien loco sí que sí 😈</figcaption>
        </figure>
        <figure>
          <img
            src=".\imagenes\imagen_2.jpg"
            alt="Stick dog"
            width="300"
            height="200"
          />
          <figcaption>
            Un perro sin extremidades con zapatos muy finos 👌
          </figcaption>
        </figure>
        <figure>
          <img
            src=".\imagenes\imagen_3.jpg"
            alt="DinoCJ"
            width="300"
            height="200"
          />
          <figcaption>
            CJ en su prime promoviendo el crimen en la prehistoria 💀
          </figcaption>
        </figure>
        <figure>
          <img
            src=".\imagenes\imagen_4.jpg"
            alt="Doomguy"
            width="300"
            height="200"
          />
          <figcaption>El doom chico 😁</figcaption>
        </figure>
        <figure>
          <img
            src=".\imagenes\imagen_5.jpg"
            alt="GD"
            width="300"
            height="200"
          />
          <figcaption>El juego de cubos saltarines 😈👌</figcaption>
        </figure>
        <figure>
          <img
            src=".\imagenes\imagen_6.jpg"
            alt="2077"
            width="300"
            height="200"
          />
          <figcaption>Re triste el anime NOOOOOOO 😭</figcaption>
        </figure>
      </section>

      <!--- Sección de videos-->
      <section>
        <h3>Videos random pues qué más 😈👌</h3>
        <figure>
          <video controls preload="auto">
            <source src=".\videos\video_1.mp4" type="video/mp4" />
          </video>
        </figure>
        <figure>
          <video controls preload="auto">
            <source src=".\videos\video_2.mp4" type="video/mp4" />
          </video>
        </figure>
        <figure>
          <video controls preload="auto">
            <source src=".\videos\video_3.mp4" type="video/mp4" />
          </video>
        </figure>
      </section>
    </main>
  </body>
</html>
